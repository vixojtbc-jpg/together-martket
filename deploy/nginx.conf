# 공구마켓 Nginx 설정 (리버스 프록시: 80 → 127.0.0.1:3000)
# 서버 위치: /etc/nginx/sites-available/gonggu-market
# __SERVER_NAME__ 은 setup-server.sh 가 도메인(없으면 _)으로 바꾼다.
# HTTPS(443)는 certbot --nginx 가 이 파일에 자동으로 추가한다.

server {
    listen 80;
    listen [::]:80;
    server_name __SERVER_NAME__;

    # 이미지 업로드 5MB + 폼 데이터 여유분
    client_max_body_size 6m;

    # Nginx 버전 숨김
    server_tokens off;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 앱의 trust proxy 설정과 함께 secure 쿠키가 동작하게 한다
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
